<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тест на реакцию</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--tg-theme-bg-color, #0f1720);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #eef2f7;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    display: flex; align-items: center; justify-content: center;
  }
  #wrap {
    width: 100%; max-width: 480px; height: 100%; max-height: 800px;
    display: flex; flex-direction: column; padding: 14px;
  }
  #hud {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; font-size: 14px; color: #9fb0c3;
  }
  #hud b { color: #4ade80; font-size: 16px; }
  #arena {
    position: relative; flex: 1;
    background: #17212e; border-radius: 16px; overflow: hidden;
    box-shadow: inset 0 0 0 1px #263447;
  }
  .target {
    position: absolute;
    border-radius: 10px;
    background: #4ade80;
    box-shadow: 0 0 16px rgba(74,222,128,0.5);
    border: none;
    cursor: pointer;
  }
  .target.bad {
    background: #f87171;
    box-shadow: 0 0 16px rgba(248,113,113,0.5);
  }
  #overlay {
    position: absolute; inset: 0;
    background: rgba(15,23,32,0.92);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  #overlay h1 { margin: 0 0 6px; font-size: 26px; }
  #overlay p { margin: 0 0 18px; color: #9fb0c3; font-size: 14px; max-width: 300px; }
  #startBtn {
    background: #4ade80; color: #0b2015; border: none;
    padding: 12px 30px; border-radius: 999px; font-size: 16px; font-weight: 700;
    cursor: pointer;
  }
  #startBtn:active { transform: scale(0.96); }
  .hidden { display: none !important; }
  #timerBar {
    height: 6px; background: #263447; border-radius: 4px; overflow: hidden; margin-top: 10px;
  }
  #timerFill {
    height: 100%; background: #4ade80; width: 100%;
    transition: width 0.1s linear;
  }
</style>
</head>
<body>
<div id="wrap">
  <a href="index.html" style="align-self:flex-start;color:#9fb0c3;font-size:13px;text-decoration:none;margin-bottom:8px;">← Меню</a>
  <div id="hud">
    <div>Счёт: <b id="score">0</b></div>
    <div>Время: <b id="time">30</b>с</div>
    <div>Рекорд: <b id="best">0</b></div>
  </div>
  <div id="timerBar"><div id="timerFill"></div></div>
  <div id="arena" style="margin-top:10px;">
    <div id="overlay">
      <h1 id="overlayTitle">Тест на реакцию</h1>
      <p id="overlaySub">Тапай по зелёным квадратам, избегай красных. 30 секунд на максимальный счёт.</p>
      <button id="startBtn">Начать</button>
    </div>
  </div>
</div>

<script>
(function(){
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor(tg.themeParams.bg_color || '#0f1720'); } catch(e){}
  }
  const arena = document.getElementById('arena');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const timerFill = document.getElementById('timerFill');

  const DURATION = 30;
  let score, timeLeft, running, spawnTimeout, tickInterval, best;
  let currentTargetTimeout = null;

  best = parseInt(localStorage.getItem('reaction_best') || '0', 10);
  bestEl.textContent = best;

  function rand(min, max){ return Math.random() * (max - min) + min; }

  function spawnTarget(){
    if (!running) return;
    // clear previous target if still there (missed)
    const old = arena.querySelector('.target');
    if (old) old.remove();

    const isBad = Math.random() < 0.25;
    const size = rand(44, 72);
    const maxX = arena.clientWidth - size;
    const maxY = arena.clientHeight - size;
    const x = rand(0, Math.max(0,maxX));
    const y = rand(0, Math.max(0,maxY));

    const el = document.createElement('button');
    el.className = 'target' + (isBad ? ' bad' : '');
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = x + 'px';
    el.style.top = y + 'px';

    const lifespan = rand(650, 1100);
    el.addEventListener('click', () => {
      if (!running) return;
      if (isBad){
        score = Math.max(0, score - 5);
      } else {
        score += 1;
      }
      scoreEl.textContent = score;
      el.remove();
      clearTimeout(currentTargetTimeout);
      scheduleNext();
    });

    arena.appendChild(el);

    currentTargetTimeout = setTimeout(() => {
      el.remove();
      scheduleNext();
    }, lifespan);
  }

  function scheduleNext(){
    clearTimeout(spawnTimeout);
    spawnTimeout = setTimeout(spawnTarget, rand(150, 400));
  }

  function startGame(){
    score = 0;
    timeLeft = DURATION;
    scoreEl.textContent = score;
    timeEl.textContent = timeLeft;
    timerFill.style.width = '100%';
    overlay.classList.add('hidden');
    running = true;

    scheduleNext();

    tickInterval = setInterval(() => {
      timeLeft -= 1;
      timeEl.textContent = timeLeft;
      timerFill.style.width = (timeLeft / DURATION * 100) + '%';
      if (timeLeft <= 0){
        endGame();
      }
    }, 1000);
  }

  function endGame(){
    running = false;
    clearInterval(tickInterval);
    clearTimeout(spawnTimeout);
    clearTimeout(currentTargetTimeout);
    const old = arena.querySelector('.target');
    if (old) old.remove();

    if (score > best){
      best = score;
      localStorage.setItem('reaction_best', best);
      bestEl.textContent = best;
    }
    overlayTitle.textContent = 'Время вышло!';
    overlaySub.textContent = 'Счёт: ' + score + ' · Рекорд: ' + best;
    startBtn.textContent = 'Ещё раз';
    overlay.classList.remove('hidden');
  }

  startBtn.addEventListener('click', startGame);
})();
</script>
</body>
</html>
