<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Побег стрелок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--tg-theme-bg-color, #12161f);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #eef0f8;
    overscroll-behavior: none;
    user-select: none;
    overflow: hidden;
  }
  #app {
    height: 100%;
    height: 100dvh;
    max-width: 460px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: 0 14px calc(14px + env(safe-area-inset-bottom, 0px));
  }
  #topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0;
    flex-shrink: 0;
  }
  #backBtn {
    display: flex; align-items: center; gap: 6px;
    background: #232838; color: #eef0f8;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 14px; font-weight: 600;
    text-decoration: none;
    flex-shrink: 0;
  }
  #backBtn:active { transform: scale(0.95); }
  #scores { display: flex; gap: 8px; margin-left: auto; }
  .scorebox {
    background: #232838; border-radius: 8px;
    padding: 5px 10px; text-align: center; min-width: 54px;
  }
  .scorebox .label { font-size: 10px; text-transform: uppercase; color: #8a93ad; }
  .scorebox .val { font-size: 15px; font-weight: 700; color: #ffb703; }
  #mid {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
  }
  #boardHolder {
    background: #1b2030; border-radius: 12px; padding: 6px;
    position: relative;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  #grid {
    position: absolute; inset: 6px;
    display: grid; gap: 6px;
  }
  .cellbg { background: rgba(255,255,255,0.04); border-radius: 6px; }
  #tiles { position: absolute; inset: 6px; }
  .tile {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.22s ease, opacity 0.22s ease;
  }
  .tile .arrowShape {
    width: 55%; height: 55%;
    background: #ff9f43;
    clip-path: polygon(50% 0%, 100% 60%, 70% 60%, 70% 100%, 30% 100%, 30% 60%, 0% 60%);
  }
  .tile.c1 .arrowShape { background: #ff9f43; }
  .tile.c2 .arrowShape { background: #4ade80; }
  .tile.c3 .arrowShape { background: #60a5fa; }
  .tile.c4 .arrowShape { background: #f87171; }
  .tile.c5 .arrowShape { background: #c084fc; }
  .tile.shake { animation: shake 0.3s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  #overlay {
    position: absolute; inset: 0; border-radius: 12px;
    background: rgba(18,22,31,0.94);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  #overlay h1 { margin: 0 0 6px; font-size: 24px; }
  #overlay p { margin: 0 0 18px; color: #9aa5c0; font-size: 13px; max-width: 280px; }
  #startBtn {
    background: #ff9f43; color: #2a1600; border: none;
    padding: 12px 30px; border-radius: 999px; font-size: 16px; font-weight: 700;
    cursor: pointer;
  }
  #startBtn:active { transform: scale(0.96); }
  .hidden { display: none !important; }
  .hint { color: #6b7492; font-size: 12px; text-align: center; flex-shrink: 0; padding: 6px 0; }
  #restartBtn {
    background: none; border: 1px solid rgba(255,255,255,0.15);
    color: #8a93ad; padding: 7px 14px; border-radius: 8px;
    font-size: 12px; cursor: pointer; flex-shrink: 0;
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <a id="backBtn" href="index.html">← Меню</a>
    <div id="scores">
      <div class="scorebox"><div class="label">Уровень</div><div class="val" id="level">1</div></div>
      <div class="scorebox"><div class="label">Осталось</div><div class="val" id="left">0</div></div>
      <div class="scorebox"><div class="label">Рекорд</div><div class="val" id="best">0</div></div>
    </div>
  </div>
  <div id="mid">
    <div id="boardHolder">
      <div id="grid"></div>
      <div id="tiles"></div>
      <div id="overlay">
        <h1 id="overlayTitle">Побег стрелок</h1>
        <p id="overlaySub">Нажимай на стрелку — она уедет туда, куда указывает, если путь свободен. Убери все стрелки с поля.</p>
        <button id="startBtn">Начать</button>
      </div>
    </div>
  </div>
  <button id="restartBtn">Начать уровень заново</button>
</div>

<script>
(function(){
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.disableVerticalSwipes(); } catch(e){}
    try { tg.setHeaderColor(tg.themeParams.bg_color || '#12161f'); } catch(e){}
  }
  function haptic(style){
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred(style || 'light'); } catch(e){} }
  }
  function hapticNotify(type){
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred(type); } catch(e){} }
  }

  const SIZE = 6;
  const DIRS = {
    up:    {dx:0,  dy:-1, rot:0},
    right: {dx:1,  dy:0,  rot:90},
    down:  {dx:0,  dy:1,  rot:180},
    left:  {dx:-1, dy:0,  rot:270}
  };
  const DIR_KEYS = Object.keys(DIRS);
  const COLOR_CLASSES = ['c1','c2','c3','c4','c5'];

  const gridEl = document.getElementById('grid');
  const tilesEl = document.getElementById('tiles');
  const boardHolder = document.getElementById('boardHolder');
  const mid = document.getElementById('mid');
  const levelEl = document.getElementById('level');
  const leftEl = document.getElementById('left');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');

  let board, level, best, running, tileEls;

  best = parseInt(localStorage.getItem('arrows_best') || '1', 10);
  bestEl.textContent = best;

  gridEl.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
  gridEl.style.gridTemplateRows = `repeat(${SIZE}, 1fr)`;
  for (let i=0;i<SIZE*SIZE;i++){
    const c = document.createElement('div');
    c.className = 'cellbg';
    gridEl.appendChild(c);
  }

  function emptyBoard(){
    return Array.from({length:SIZE}, () => Array(SIZE).fill(null));
  }

  function arrowCountForLevel(lv){
    return Math.min(10 + lv * 2, 28);
  }

  function isPathClear(b, x, y, dirKey, excludeSelf){
    const {dx,dy} = DIRS[dirKey];
    let cx = x + dx, cy = y + dy;
    while (cx >= 0 && cx < SIZE && cy >= 0 && cy < SIZE){
      if (b[cy][cx]) return false;
      cx += dx; cy += dy;
    }
    return true;
  }

  function generateBoard(count){
    const b = emptyBoard();
    let placed = 0, attempts = 0;
    const maxAttempts = count * 300;
    while (placed < count && attempts < maxAttempts){
      attempts++;
      const x = Math.floor(Math.random()*SIZE);
      const y = Math.floor(Math.random()*SIZE);
      if (b[y][x]) continue;
      const dirKey = DIR_KEYS[Math.floor(Math.random()*4)];
      if (isPathClear(b, x, y, dirKey)){
        b[y][x] = { dir: dirKey, color: COLOR_CLASSES[Math.floor(Math.random()*COLOR_CLASSES.length)] };
        placed++;
      }
    }
    return b;
  }

  function fitBoardSize(){
    const midRect = mid.getBoundingClientRect();
    let size = Math.floor(Math.min(midRect.width, midRect.height, 440));
    if (size < 200) size = 200;
    boardHolder.style.width = size + 'px';
    boardHolder.style.height = size + 'px';
  }
  window.addEventListener('resize', () => { fitBoardSize(); render(); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { fitBoardSize(); render(); });

  function cellGeometry(){
    const total = boardHolder.clientWidth - 12;
    const gap = 6;
    const cs = (total - gap*(SIZE-1)) / SIZE;
    return { cs, gap };
  }

  function countArrows(){
    let n = 0;
    for (let y=0;y<SIZE;y++) for (let x=0;x<SIZE;x++) if (board[y][x]) n++;
    return n;
  }

  function render(){
    tilesEl.innerHTML = '';
    tileEls = {};
    const { cs, gap } = cellGeometry();
    for (let y=0;y<SIZE;y++){
      for (let x=0;x<SIZE;x++){
        const arrow = board[y][x];
        if (!arrow) continue;
        const el = document.createElement('div');
        el.className = 'tile ' + arrow.color;
        el.style.width = cs + 'px';
        el.style.height = cs + 'px';
        el.style.left = (x*(cs+gap)) + 'px';
        el.style.top = (y*(cs+gap)) + 'px';
        const shape = document.createElement('div');
        shape.className = 'arrowShape';
        shape.style.transform = 'rotate(' + DIRS[arrow.dir].rot + 'deg)';
        el.appendChild(shape);
        el.addEventListener('click', () => onTap(x, y, el));
        tilesEl.appendChild(el);
        tileEls[y+'_'+x] = el;
      }
    }
    leftEl.textContent = countArrows();
  }

  function onTap(x, y, el){
    if (!running) return;
    const arrow = board[y][x];
    if (!arrow) return;
    if (!isPathClear(board, x, y, arrow.dir)){
      el.classList.remove('shake');
      void el.offsetWidth;
      el.classList.add('shake');
      hapticNotify('error');
      return;
    }
    // valid move: animate off board
    const { dx, dy } = DIRS[arrow.dir];
    const { cs, gap } = cellGeometry();
    const travel = (SIZE) * (cs + gap);
    const curLeft = parseFloat(el.style.left);
    const curTop = parseFloat(el.style.top);
    el.style.left = (curLeft + dx*travel) + 'px';
    el.style.top = (curTop + dy*travel) + 'px';
    el.style.opacity = '0';
    haptic('light');
    board[y][x] = null;
    setTimeout(() => {
      el.remove();
      leftEl.textContent = countArrows();
      checkProgress();
    }, 220);
  }

  function anyMoveAvailable(){
    for (let y=0;y<SIZE;y++){
      for (let x=0;x<SIZE;x++){
        const a = board[y][x];
        if (a && isPathClear(board, x, y, a.dir)) return true;
      }
    }
    return false;
  }

  function checkProgress(){
    const remaining = countArrows();
    if (remaining === 0){
      level++;
      if (level - 1 > best){
        best = level - 1;
        localStorage.setItem('arrows_best', best);
        bestEl.textContent = best;
      }
      levelEl.textContent = level;
      hapticNotify('success');
      startLevel();
      return;
    }
    if (!anyMoveAvailable()){
      showDeadlock();
    }
  }

  function showDeadlock(){
    running = false;
    overlayTitle.textContent = 'Тупик!';
    overlaySub.textContent = 'Свободных ходов не осталось. Попробуй уровень ' + level + ' ещё раз.';
    startBtn.textContent = 'Заново';
    overlay.classList.remove('hidden');
  }

  function startLevel(){
    board = generateBoard(arrowCountForLevel(level));
    fitBoardSize();
    render();
    running = true;
    overlay.classList.add('hidden');
  }

  function startGame(){
    level = 1;
    levelEl.textContent = level;
    startLevel();
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', () => {
    if (!level) return;
    startLevel();
  });

  fitBoardSize();
  board = emptyBoard();
  render();
  setTimeout(fitBoardSize, 100);
})();
</script>
</body>
</html>
