<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Змейка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--tg-theme-bg-color, #1e2530);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overscroll-behavior: none;
    user-select: none;
    overflow: hidden;
  }
  #app {
    height: 100%;
    height: 100dvh;
    max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: 0 12px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  #topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0;
    flex-shrink: 0;
  }
  #backBtn {
    display: flex; align-items: center; gap: 6px;
    background: #2e3949; color: #e8ecf1;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 14px; font-weight: 600;
    text-decoration: none;
    flex-shrink: 0;
  }
  #backBtn:active { transform: scale(0.95); }
  #settingsBtn {
    width: 36px; height: 36px; border-radius: 50%;
    background: #2e3949; color: #e8ecf1;
    border: 1px solid rgba(255,255,255,0.12);
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #settingsBtn:active { transform: scale(0.92); }
  #hud {
    flex: 1;
    display: flex; justify-content: flex-end; gap: 16px;
    color: #e8ecf1; font-size: 15px;
  }
  #hud b { color: #7ee787; }
  #mid {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
  }
  #boardHolder {
    background: #262f3d;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #overlay {
    position: absolute; inset: 0;
    background: rgba(15,18,24,0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #e8ecf1; text-align: center; padding: 20px;
  }
  #overlay h1 { margin: 0 0 6px; font-size: 24px; }
  #overlay p { margin: 0 0 16px; color: #9aa5b1; font-size: 13px; }
  #startBtn {
    background: #7ee787; color: #10241a; border: none;
    padding: 12px 28px; border-radius: 999px; font-size: 16px; font-weight: 600;
    cursor: pointer;
  }
  #startBtn:active { transform: scale(0.96); }
  #controls {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 56px 56px 56px;
    gap: 6px;
    justify-content: center;
  }
  .ctrl {
    background: #2e3949; color: #e8ecf1; border: none; border-radius: 12px;
    font-size: 22px; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .ctrl:active { background: #445167; }
  .hidden { display: none !important; }

  #settingsOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 10;
  }
  #settingsCard {
    background: #1e2530; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px; width: 100%; max-width: 360px; padding: 18px;
  }
  #settingsHeader { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  #settingsHeader h2 { margin: 0; font-size: 17px; color: #e8ecf1; }
  #settingsClose {
    width: 30px; height: 30px; border-radius: 50%;
    background: #2e3949; border: none; color: #e8ecf1; font-size: 14px; cursor: pointer;
  }
  .settingsRow { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .settingsLabelTitle { font-size: 15px; font-weight: 700; margin-bottom: 3px; color: #e8ecf1; }
  .settingsLabelDesc { font-size: 12px; color: #9aa5b1; line-height: 1.4; }
  .switch { position: relative; width: 48px; height: 28px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; cursor: pointer;
    background: rgba(255,255,255,0.2); border-radius: 999px; transition: background 0.2s ease;
  }
  .slider::before {
    content: ""; position: absolute; width: 22px; height: 22px;
    left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform 0.2s ease;
  }
  .switch input:checked + .slider { background: #7ee787; }
  .switch input:checked + .slider::before { transform: translateX(20px); }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <a id="backBtn" href="index.html">← Меню</a>
    <div id="hud">
      <div>Счёт: <b id="score">0</b></div>
      <div>Рекорд: <b id="best">0</b></div>
    </div>
    <button id="settingsBtn" aria-label="Настройки">⚙️</button>
  </div>
  <div id="mid">
    <div id="boardHolder">
      <canvas id="game"></canvas>
      <div id="overlay">
        <h1 id="overlayTitle">Змейка</h1>
        <p id="overlaySub">Свайпай по полю или используй кнопки</p>
        <button id="startBtn">Начать</button>
      </div>
    </div>
    <div id="controls">
      <div></div>
      <button class="ctrl" data-dir="up">▲</button>
      <div></div>
      <button class="ctrl" data-dir="left">◀</button>
      <button class="ctrl" data-dir="down">▼</button>
      <button class="ctrl" data-dir="right">▶</button>
    </div>
  </div>
</div>

<div id="settingsOverlay" class="hidden">
  <div id="settingsCard">
    <div id="settingsHeader">
      <h2>Настройки</h2>
      <button id="settingsClose">✕</button>
    </div>
    <div class="settingsRow">
      <div>
        <div class="settingsLabelTitle">Сохранять рекорд</div>
        <div class="settingsLabelDesc">Лучший результат будет запоминаться на этом устройстве между заходами</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="saveToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<script>
(function(){
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.disableVerticalSwipes(); } catch(e){}
    try { tg.setHeaderColor(tg.themeParams.bg_color || '#1e2530'); } catch(e){}
  }
  function haptic(style){
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred(style || 'light'); } catch(e){} }
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const boardHolder = document.getElementById('boardHolder');
  const mid = document.getElementById('mid');
  const controls = document.getElementById('controls');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const startBtn = document.getElementById('startBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const settingsClose = document.getElementById('settingsClose');
  const saveToggle = document.getElementById('saveToggle');

  const SAVE_PREF_KEY = 'arcade_save_enabled';
  const BEST_KEY = 'snake_best';
  function saveEnabled(){ try { return localStorage.getItem(SAVE_PREF_KEY) === '1'; } catch(e){ return false; } }
  function setSaveEnabled(v){ try { localStorage.setItem(SAVE_PREF_KEY, v ? '1' : '0'); } catch(e){} }
  function saveBest(){ if (saveEnabled()) { try { localStorage.setItem(BEST_KEY, best); } catch(e){} } }
  function clearBest(){ try { localStorage.removeItem(BEST_KEY); } catch(e){} }

  settingsBtn.addEventListener('click', () => {
    saveToggle.checked = saveEnabled();
    settingsOverlay.classList.remove('hidden');
  });
  settingsClose.addEventListener('click', () => settingsOverlay.classList.add('hidden'));
  settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) settingsOverlay.classList.add('hidden'); });
  saveToggle.addEventListener('change', () => {
    haptic('light');
    if (saveToggle.checked) { setSaveEnabled(true); saveBest(); }
    else { setSaveEnabled(false); clearBest(); }
  });

  const GRID = 18;
  let cell, snake, dir, nextDir, food, score, best, running, loopId, speedMs;

  best = saveEnabled() ? parseInt(localStorage.getItem(BEST_KEY) || '0', 10) : 0;
  bestEl.textContent = best;

  function fitBoardSize() {
    const midRect = mid.getBoundingClientRect();
    const controlsH = controls.getBoundingClientRect().height;
    const availW = midRect.width;
    const availH = midRect.height - controlsH - 10;
    let size = Math.floor(Math.min(availW, availH, 460));
    if (size < 160) size = 160;
    return size;
  }

  function resize() {
    const size = fitBoardSize();
    boardHolder.style.width = size + 'px';
    boardHolder.style.height = size + 'px';
    canvas.width = size * devicePixelRatio;
    canvas.height = size * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    cell = size / GRID;
    draw();
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

  function reset() {
    snake = [{x: 8, y: 9}, {x: 7, y: 9}, {x: 6, y: 9}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    speedMs = 130;
    scoreEl.textContent = score;
    placeFood();
  }

  function placeFood() {
    let ok = false;
    while (!ok) {
      food = { x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID) };
      ok = !snake.some(s => s.x===food.x && s.y===food.y);
    }
  }

  function draw() {
    const size = boardHolder.clientWidth;
    ctx.clearRect(0,0,size,size);
    ctx.fillStyle = '#262f3d';
    ctx.fillRect(0,0,size,size);

    ctx.fillStyle = '#ff6b6b';
    roundRect(food.x*cell+cell*0.15, food.y*cell+cell*0.15, cell*0.7, cell*0.7, cell*0.2);

    snake.forEach((s, i) => {
      ctx.fillStyle = i===0 ? '#7ee787' : '#4fae63';
      roundRect(s.x*cell+1, s.y*cell+1, cell-2, cell-2, cell*0.25);
    });
  }

  function roundRect(x,y,w,h,r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
    ctx.fill();
  }

  function step() {
    if (!(nextDir.x === -dir.x && nextDir.y === -dir.y)) dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID || snake.some(s => s.x===head.x && s.y===head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      if (speedMs > 60) speedMs -= 2;
      restartLoop();
    } else {
      snake.pop();
    }
    draw();
  }

  function restartLoop() {
    clearInterval(loopId);
    loopId = setInterval(step, speedMs);
  }

  function gameOver() {
    running = false;
    clearInterval(loopId);
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      saveBest();
    }
    overlayTitle.textContent = 'Игра окончена';
    overlaySub.textContent = 'Счёт: ' + score + '  •  Рекорд: ' + best;
    startBtn.textContent = 'Ещё раз';
    overlay.classList.remove('hidden');
  }

  function startGame() {
    reset();
    overlay.classList.add('hidden');
    running = true;
    resize();
    restartLoop();
  }

  startBtn.addEventListener('click', startGame);

  function setDir(x,y) {
    if (!running) return;
    nextDir = {x,y};
  }

  document.querySelectorAll('.ctrl').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.dir;
      if (d==='up') setDir(0,-1);
      if (d==='down') setDir(0,1);
      if (d==='left') setDir(-1,0);
      if (d==='right') setDir(1,0);
    });
  });

  window.addEventListener('keydown', (e) => {
    switch(e.key) {
      case 'ArrowUp': case 'w': setDir(0,-1); break;
      case 'ArrowDown': case 's': setDir(0,1); break;
      case 'ArrowLeft': case 'a': setDir(-1,0); break;
      case 'ArrowRight': case 'd': setDir(1,0); break;
    }
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, {passive:true});

  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (Math.abs(dx) > 20) setDir(dx > 0 ? 1 : -1, 0);
    } else {
      if (Math.abs(dy) > 20) setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  }, {passive:true});

  reset();
  resize();
  draw();
  setTimeout(resize, 100);
})();
</script>
</body>
</html>
