<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мини-игры</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--tg-theme-bg-color, #14151f);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--tg-theme-text-color, #eef0f8);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    max-width: 480px; margin: 0 auto; padding: 24px 16px;
  }
  h1 { font-size: 24px; margin: 4px 0 4px; text-align: center; }
  p.sub {
    text-align: center; font-size: 13px; margin: 0 0 24px;
    color: var(--tg-theme-hint-color, #9aa0c0);
  }
  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  .card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
    background: var(--tg-theme-secondary-bg-color, #1f2233);
    border: 1px solid rgba(128,128,128,0.15);
    border-radius: 16px;
    padding: 24px 12px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.08s ease;
  }
  .card:active { transform: scale(0.96); }
  .card .icon { font-size: 38px; }
  .card .name { font-weight: 700; font-size: 15px; text-align: center; }
  .card .desc {
    font-size: 11px; text-align: center;
    color: var(--tg-theme-hint-color, #9aa0c0);
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>🎮 Мини-игры</h1>
  <p class="sub">Выбери во что поиграть</p>
  <div class="grid">
    <a class="card" href="snake.html">
      <div class="icon">🐍</div>
      <div class="name">Змейка</div>
      <div class="desc">Классика</div>
    </a>
    <a class="card" href="game2048.html">
      <div class="icon">🔢</div>
      <div class="name">2048</div>
      <div class="desc">Головоломка</div>
    </a>
    <a class="card" href="clicker.html">
      <div class="icon">💰</div>
      <div class="name">Кликер</div>
      <div class="desc">Копи и качайся</div>
    </a>
    <a class="card" href="reaction.html">
      <div class="icon">⚡</div>
      <div class="name">Реакция</div>
      <div class="desc">30 секунд на скорость</div>
    </a>
  </div>
</div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    try { tg.disableVerticalSwipes(); } catch(e){}
    try { tg.setHeaderColor(tg.themeParams.bg_color || '#14151f'); } catch(e){}
  }
</script>
</body>
</html>
