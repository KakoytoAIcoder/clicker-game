<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--tg-theme-bg-color, #faf8ef);
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
  }
  #wrap {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 460px; padding: 16px;
  }
  #top {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  h1 { margin: 0; color: #776e65; font-size: 32px; }
  #scores { display: flex; gap: 8px; }
  .scorebox {
    background: #bbada0; color: #eee4da; border-radius: 8px;
    padding: 6px 14px; text-align: center; min-width: 64px;
  }
  .scorebox .label { font-size: 11px; text-transform: uppercase; color: #eee4da; opacity: 0.8; }
  .scorebox .val { font-size: 18px; font-weight: 700; color: #fff; }
  #boardHolder {
    width: 100%; aspect-ratio: 1/1;
    background: #bbada0; border-radius: 10px; padding: 8px;
    position: relative;
  }
  #grid {
    position: absolute; inset: 8px;
    display: grid; grid-template-columns: repeat(4,1fr); grid-template-rows: repeat(4,1fr);
    gap: 8px;
  }
  .cellbg { background: rgba(238,228,218,0.35); border-radius: 6px; }
  #tiles { position: absolute; inset: 8px; }
  .tile {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px; font-weight: 700;
    transition: left 0.1s ease, top 0.1s ease, transform 0.1s ease;
  }
  #overlay {
    position: absolute; inset: 0; border-radius: 10px;
    background: rgba(238,228,218,0.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #776e65; text-align: center; padding: 20px;
  }
  #overlay h2 { margin: 0 0 6px; font-size: 26px; }
  #overlay p { margin: 0 0 16px; font-size: 14px; }
  #startBtn {
    background: #8f7a66; color: #fff; border: none;
    padding: 12px 28px; border-radius: 8px; font-size: 16px; font-weight: 700;
    cursor: pointer;
  }
  .hidden { display: none !important; }
  .hint { color: #9a9086; font-size: 12px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <a href="index.html" style="align-self:flex-start;color:#9a9086;font-size:13px;text-decoration:none;margin-bottom:8px;">← Меню</a>
  <div id="top">
    <h1>2048</h1>
    <div id="scores">
      <div class="scorebox"><div class="label">Счёт</div><div class="val" id="score">0</div></div>
      <div class="scorebox"><div class="label">Рекорд</div><div class="val" id="best">0</div></div>
    </div>
  </div>
  <div id="boardHolder">
    <div id="grid"></div>
    <div id="tiles"></div>
    <div id="overlay">
      <h2 id="overlayTitle">2048</h2>
      <p id="overlaySub">Свайпай или стрелками объединяй одинаковые числа</p>
      <button id="startBtn">Начать</button>
    </div>
  </div>
  <div class="hint">Свайп по полю или стрелки/WASD</div>
</div>

<script>
(function(){
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor(tg.themeParams.bg_color || '#faf8ef'); } catch(e){}
  }
  const SIZE = 4;
  let board, score, best, running;
  const gridEl = document.getElementById('grid');
  const tilesEl = document.getElementById('tiles');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const startBtn = document.getElementById('startBtn');
  const holder = document.getElementById('boardHolder');

  best = parseInt(localStorage.getItem('2048_best') || '0', 10);
  bestEl.textContent = best;

  for (let i=0;i<16;i++){
    const c = document.createElement('div');
    c.className = 'cellbg';
    gridEl.appendChild(c);
  }

  const colors = {
    2: ['#eee4da','#776e65'], 4: ['#ede0c8','#776e65'], 8: ['#f2b179','#f9f6f2'],
    16: ['#f59563','#f9f6f2'], 32: ['#f67c5f','#f9f6f2'], 64: ['#f65e3b','#f9f6f2'],
    128: ['#edcf72','#f9f6f2'], 256: ['#edcc61','#f9f6f2'], 512: ['#edc850','#f9f6f2'],
    1024: ['#edc53f','#f9f6f2'], 2048: ['#edc22e','#f9f6f2']
  };

  function emptyBoard(){ return Array.from({length:SIZE},()=>Array(SIZE).fill(0)); }

  function addRandom(){
    const empties = [];
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) if (board[r][c]===0) empties.push([r,c]);
    if (!empties.length) return;
    const [r,c] = empties[Math.floor(Math.random()*empties.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function reset(){
    board = emptyBoard();
    score = 0;
    scoreEl.textContent = score;
    addRandom(); addRandom();
    render();
  }

  function cellSize(){
    const total = holder.clientWidth - 16;
    const gap = 8;
    return (total - gap*3) / 4;
  }

  function render(){
    tilesEl.innerHTML = '';
    const cs = cellSize();
    const gap = 8;
    for (let r=0;r<SIZE;r++){
      for (let c=0;c<SIZE;c++){
        const v = board[r][c];
        if (!v) continue;
        const el = document.createElement('div');
        el.className = 'tile';
        el.style.width = cs+'px';
        el.style.height = cs+'px';
        el.style.left = (c*(cs+gap))+'px';
        el.style.top = (r*(cs+gap))+'px';
        el.style.fontSize = (v > 512 ? cs*0.32 : cs*0.4)+'px';
        const col = colors[v] || ['#3c3a32','#f9f6f2'];
        el.style.background = col[0];
        el.style.color = col[1];
        el.textContent = v;
        tilesEl.appendChild(el);
      }
    }
  }

  function slideRowLeft(row){
    let arr = row.filter(v => v!==0);
    let gained = 0;
    for (let i=0;i<arr.length-1;i++){
      if (arr[i] === arr[i+1]){
        arr[i] *= 2;
        gained += arr[i];
        arr.splice(i+1,1);
      }
    }
    while (arr.length < SIZE) arr.push(0);
    return {row: arr, gained};
  }

  function rotateBoard(b){
    const nb = emptyBoard();
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) nb[c][SIZE-1-r] = b[r][c];
    return nb;
  }

  function move(dir){
    if (!running) return;
    let b = board;
    let rotations = 0;
    if (dir==='up') rotations = 3;
    else if (dir==='right') rotations = 2;
    else if (dir==='down') rotations = 1;

    for (let i=0;i<rotations;i++) b = rotateBoard(b);

    let moved = false;
    let gainedTotal = 0;
    const newB = [];
    for (let r=0;r<SIZE;r++){
      const before = b[r].slice();
      const {row, gained} = slideRowLeft(b[r]);
      newB.push(row);
      gainedTotal += gained;
      if (row.some((v,i)=>v!==before[i])) moved = true;
    }
    b = newB;

    for (let i=0;i<(4-rotations)%4;i++) b = rotateBoard(b);

    if (moved){
      board = b;
      score += gainedTotal;
      scoreEl.textContent = score;
      addRandom();
      render();
      checkEnd();
    }
  }

  function canMove(){
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++){
      if (board[r][c]===0) return true;
      if (c<SIZE-1 && board[r][c]===board[r][c+1]) return true;
      if (r<SIZE-1 && board[r][c]===board[r+1][c]) return true;
    }
    return false;
  }

  function checkEnd(){
    const hasWon = board.some(row => row.some(v => v>=2048));
    if (hasWon){
      endGame(true);
      return;
    }
    if (!canMove()){
      endGame(false);
    }
  }

  function endGame(won){
    running = false;
    if (score > best){
      best = score;
      localStorage.setItem('2048_best', best);
      bestEl.textContent = best;
    }
    overlayTitle.textContent = won ? 'Ты собрал 2048!' : 'Игра окончена';
    overlaySub.textContent = 'Счёт: ' + score + '  •  Рекорд: ' + best;
    startBtn.textContent = 'Ещё раз';
    overlay.classList.remove('hidden');
  }

  function startGame(){
    reset();
    overlay.classList.add('hidden');
    running = true;
  }

  startBtn.addEventListener('click', startGame);
  window.addEventListener('resize', render);

  window.addEventListener('keydown', (e) => {
    switch(e.key){
      case 'ArrowUp': case 'w': e.preventDefault(); move('up'); break;
      case 'ArrowDown': case 's': e.preventDefault(); move('down'); break;
      case 'ArrowLeft': case 'a': e.preventDefault(); move('left'); break;
      case 'ArrowRight': case 'd': e.preventDefault(); move('right'); break;
    }
  });

  let touchStart = null;
  holder.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStart = {x: t.clientX, y: t.clientY};
  }, {passive:true});

  holder.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.max(Math.abs(dx),Math.abs(dy)) > 20){
      if (Math.abs(dx) > Math.abs(dy)) move(dx>0 ? 'right' : 'left');
      else move(dy>0 ? 'down' : 'up');
    }
    touchStart = null;
  }, {passive:true});

  board = emptyBoard();
  render();
})();
</script>
</body>
</html>
