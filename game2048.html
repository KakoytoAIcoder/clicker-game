<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2048</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--tg-theme-bg-color, #faf8ef);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overscroll-behavior: none;
    user-select: none;
    overflow: hidden;
  }
  #app {
    height: 100%;
    height: 100dvh;
    max-width: 460px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: 0 14px calc(14px + env(safe-area-inset-bottom, 0px));
  }
  #topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0 4px;
    flex-shrink: 0;
  }
  #backBtn {
    display: flex; align-items: center; gap: 6px;
    background: #eee4da; color: #776e65;
    border: 1px solid rgba(119,110,101,0.2);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 14px; font-weight: 700;
    text-decoration: none;
    flex-shrink: 0;
  }
  #backBtn:active { transform: scale(0.95); }
  h1 { margin: 0; color: #776e65; font-size: 24px; flex-shrink: 0; }
  #scores { display: flex; gap: 8px; margin-left: auto; }
  .scorebox {
    background: #bbada0; color: #eee4da; border-radius: 8px;
    padding: 5px 10px; text-align: center; min-width: 54px;
  }
  .scorebox .label { font-size: 10px; text-transform: uppercase; color: #eee4da; opacity: 0.8; }
  .scorebox .val { font-size: 15px; font-weight: 700; color: #fff; }
  #settingsBtn {
    width: 34px; height: 34px; border-radius: 50%;
    background: #eee4da; color: #776e65;
    border: 1px solid rgba(119,110,101,0.2);
    font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #settingsBtn:active { transform: scale(0.92); }
  #mid {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #boardHolder {
    background: #bbada0; border-radius: 10px; padding: 8px;
    position: relative;
  }
  #grid {
    position: absolute; inset: 8px;
    display: grid; grid-template-columns: repeat(4,1fr); grid-template-rows: repeat(4,1fr);
    gap: 8px;
  }
  .cellbg { background: rgba(238,228,218,0.35); border-radius: 6px; }
  #tiles { position: absolute; inset: 8px; }
  .tile {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px; font-weight: 700;
    transition: left 0.1s ease, top 0.1s ease, transform 0.1s ease;
  }
  #overlay {
    position: absolute; inset: 0; border-radius: 10px;
    background: rgba(238,228,218,0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #776e65; text-align: center; padding: 20px;
  }
  #overlay h2 { margin: 0 0 6px; font-size: 24px; }
  #overlay p { margin: 0 0 16px; font-size: 13px; }
  #startBtn {
    background: #8f7a66; color: #fff; border: none;
    padding: 12px 28px; border-radius: 8px; font-size: 16px; font-weight: 700;
    cursor: pointer;
  }
  .hidden { display: none !important; }
  .hint { color: #9a9086; font-size: 12px; text-align: center; flex-shrink: 0; padding: 8px 0; }

  #settingsOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 10;
  }
  #settingsCard {
    background: #faf8ef; border: 1px solid rgba(119,110,101,0.2);
    border-radius: 16px; width: 100%; max-width: 360px; padding: 18px;
  }
  #settingsHeader { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  #settingsHeader h2 { margin: 0; font-size: 17px; color: #776e65; }
  #settingsClose {
    width: 30px; height: 30px; border-radius: 50%;
    background: #eee4da; border: none; color: #776e65; font-size: 14px; cursor: pointer;
  }
  .settingsRow { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .settingsLabelTitle { font-size: 15px; font-weight: 700; margin-bottom: 3px; color: #776e65; }
  .settingsLabelDesc { font-size: 12px; color: #9a9086; line-height: 1.4; }
  .switch { position: relative; width: 48px; height: 28px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; cursor: pointer;
    background: rgba(119,110,101,0.25); border-radius: 999px; transition: background 0.2s ease;
  }
  .slider::before {
    content: ""; position: absolute; width: 22px; height: 22px;
    left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform 0.2s ease;
  }
  .switch input:checked + .slider { background: #edc22e; }
  .switch input:checked + .slider::before { transform: translateX(20px); }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <a id="backBtn" href="index.html">← Меню</a>
    <h1>2048</h1>
    <div id="scores">
      <div class="scorebox"><div class="label">Счёт</div><div class="val" id="score">0</div></div>
      <div class="scorebox"><div class="label">Рекорд</div><div class="val" id="best">0</div></div>
    </div>
    <button id="settingsBtn" aria-label="Настройки">⚙️</button>
  </div>
  <div id="mid">
    <div id="boardHolder">
      <div id="grid"></div>
      <div id="tiles"></div>
      <div id="overlay">
        <h2 id="overlayTitle">2048</h2>
        <p id="overlaySub">Свайпай — объединяй одинаковые числа</p>
        <button id="startBtn">Начать</button>
      </div>
    </div>
  </div>
  <div class="hint">Свайп по полю или стрелки/WASD</div>
</div>

<div id="settingsOverlay" class="hidden">
  <div id="settingsCard">
    <div id="settingsHeader">
      <h2>Настройки</h2>
      <button id="settingsClose">✕</button>
    </div>
    <div class="settingsRow">
      <div>
        <div class="settingsLabelTitle">Сохранять рекорд</div>
        <div class="settingsLabelDesc">Лучший результат будет запоминаться на этом устройстве между заходами</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="saveToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<script>
(function(){
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.disableVerticalSwipes(); } catch(e){}
    try { tg.setHeaderColor(tg.themeParams.bg_color || '#faf8ef'); } catch(e){}
  }
  function haptic(style){
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred(style || 'light'); } catch(e){} }
  }

  const SIZE = 4;
  let board, score, best, running;
  const gridEl = document.getElementById('grid');
  const tilesEl = document.getElementById('tiles');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const startBtn = document.getElementById('startBtn');
  const mid = document.getElementById('mid');
  const boardHolder = document.getElementById('boardHolder');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const settingsClose = document.getElementById('settingsClose');
  const saveToggle = document.getElementById('saveToggle');

  const SAVE_PREF_KEY = 'arcade_save_enabled';
  const BEST_KEY = '2048_best';
  function saveEnabled(){ try { return localStorage.getItem(SAVE_PREF_KEY) === '1'; } catch(e){ return false; } }
  function setSaveEnabled(v){ try { localStorage.setItem(SAVE_PREF_KEY, v ? '1' : '0'); } catch(e){} }
  function saveBest(){ if (saveEnabled()) { try { localStorage.setItem(BEST_KEY, best); } catch(e){} } }
  function clearBest(){ try { localStorage.removeItem(BEST_KEY); } catch(e){} }

  settingsBtn.addEventListener('click', () => {
    saveToggle.checked = saveEnabled();
    settingsOverlay.classList.remove('hidden');
  });
  settingsClose.addEventListener('click', () => settingsOverlay.classList.add('hidden'));
  settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) settingsOverlay.classList.add('hidden'); });
  saveToggle.addEventListener('change', () => {
    haptic('light');
    if (saveToggle.checked) { setSaveEnabled(true); saveBest(); }
    else { setSaveEnabled(false); clearBest(); }
  });

  best = saveEnabled() ? parseInt(localStorage.getItem(BEST_KEY) || '0', 10) : 0;
  bestEl.textContent = best;

  for (let i=0;i<16;i++){
    const c = document.createElement('div');
    c.className = 'cellbg';
    gridEl.appendChild(c);
  }

  const colors = {
    2: ['#eee4da','#776e65'], 4: ['#ede0c8','#776e65'], 8: ['#f2b179','#f9f6f2'],
    16: ['#f59563','#f9f6f2'], 32: ['#f67c5f','#f9f6f2'], 64: ['#f65e3b','#f9f6f2'],
    128: ['#edcf72','#f9f6f2'], 256: ['#edcc61','#f9f6f2'], 512: ['#edc850','#f9f6f2'],
    1024: ['#edc53f','#f9f6f2'], 2048: ['#edc22e','#f9f6f2']
  };

  function emptyBoard(){ return Array.from({length:SIZE},()=>Array(SIZE).fill(0)); }

  function addRandom(){
    const empties = [];
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) if (board[r][c]===0) empties.push([r,c]);
    if (!empties.length) return;
    const [r,c] = empties[Math.floor(Math.random()*empties.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function reset(){
    board = emptyBoard();
    score = 0;
    scoreEl.textContent = score;
    addRandom(); addRandom();
    fitBoardSize();
    render();
  }

  function fitBoardSize(){
    const midRect = mid.getBoundingClientRect();
    let size = Math.floor(Math.min(midRect.width, midRect.height, 440));
    if (size < 180) size = 180;
    boardHolder.style.width = size + 'px';
    boardHolder.style.height = size + 'px';
  }
  window.addEventListener('resize', () => { fitBoardSize(); render(); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { fitBoardSize(); render(); });

  function cellSize(){
    const total = boardHolder.clientWidth - 16;
    const gap = 8;
    return (total - gap*3) / 4;
  }

  function render(){
    tilesEl.innerHTML = '';
    const cs = cellSize();
    const gap = 8;
    for (let r=0;r<SIZE;r++){
      for (let c=0;c<SIZE;c++){
        const v = board[r][c];
        if (!v) continue;
        const el = document.createElement('div');
        el.className = 'tile';
        el.style.width = cs+'px';
        el.style.height = cs+'px';
        el.style.left = (c*(cs+gap))+'px';
        el.style.top = (r*(cs+gap))+'px';
        el.style.fontSize = (v > 512 ? cs*0.32 : cs*0.4)+'px';
        const col = colors[v] || ['#3c3a32','#f9f6f2'];
        el.style.background = col[0];
        el.style.color = col[1];
        el.textContent = v;
        tilesEl.appendChild(el);
      }
    }
  }

  function slideRowLeft(row){
    let arr = row.filter(v => v!==0);
    let gained = 0;
    for (let i=0;i<arr.length-1;i++){
      if (arr[i] === arr[i+1]){
        arr[i] *= 2;
        gained += arr[i];
        arr.splice(i+1,1);
      }
    }
    while (arr.length < SIZE) arr.push(0);
    return {row: arr, gained};
  }

  function rotateBoard(b){
    const nb = emptyBoard();
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) nb[c][SIZE-1-r] = b[r][c];
    return nb;
  }

  function move(dir){
    if (!running) return;
    let b = board;
    let rotations = 0;
    if (dir==='up') rotations = 3;
    else if (dir==='right') rotations = 2;
    else if (dir==='down') rotations = 1;

    for (let i=0;i<rotations;i++) b = rotateBoard(b);

    let moved = false;
    let gainedTotal = 0;
    const newB = [];
    for (let r=0;r<SIZE;r++){
      const before = b[r].slice();
      const {row, gained} = slideRowLeft(b[r]);
      newB.push(row);
      gainedTotal += gained;
      if (row.some((v,i)=>v!==before[i])) moved = true;
    }
    b = newB;

    for (let i=0;i<(4-rotations)%4;i++) b = rotateBoard(b);

    if (moved){
      board = b;
      score += gainedTotal;
      scoreEl.textContent = score;
      addRandom();
      render();
      checkEnd();
    }
  }

  function canMove(){
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++){
      if (board[r][c]===0) return true;
      if (c<SIZE-1 && board[r][c]===board[r][c+1]) return true;
      if (r<SIZE-1 && board[r][c]===board[r+1][c]) return true;
    }
    return false;
  }

  function checkEnd(){
    const hasWon = board.some(row => row.some(v => v>=2048));
    if (hasWon){
      endGame(true);
      return;
    }
    if (!canMove()){
      endGame(false);
    }
  }

  function endGame(won){
    running = false;
    if (score > best){
      best = score;
      bestEl.textContent = best;
      saveBest();
    }
    overlayTitle.textContent = won ? 'Ты собрал 2048!' : 'Игра окончена';
    overlaySub.textContent = 'Счёт: ' + score + '  •  Рекорд: ' + best;
    startBtn.textContent = 'Ещё раз';
    overlay.classList.remove('hidden');
  }

  function startGame(){
    reset();
    overlay.classList.add('hidden');
    running = true;
  }

  startBtn.addEventListener('click', startGame);

  window.addEventListener('keydown', (e) => {
    switch(e.key){
      case 'ArrowUp': case 'w': e.preventDefault(); move('up'); break;
      case 'ArrowDown': case 's': e.preventDefault(); move('down'); break;
      case 'ArrowLeft': case 'a': e.preventDefault(); move('left'); break;
      case 'ArrowRight': case 'd': e.preventDefault(); move('right'); break;
    }
  });

  let touchStart = null;
  boardHolder.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStart = {x: t.clientX, y: t.clientY};
  }, {passive:true});

  boardHolder.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.max(Math.abs(dx),Math.abs(dy)) > 20){
      if (Math.abs(dx) > Math.abs(dy)) move(dx>0 ? 'right' : 'left');
      else move(dy>0 ? 'down' : 'up');
    }
    touchStart = null;
  }, {passive:true});

  board = emptyBoard();
  fitBoardSize();
  render();
  setTimeout(() => { fitBoardSize(); render(); }, 100);
})();
</script>
</body>
</html>
